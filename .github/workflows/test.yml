name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scanner unit tests
        run: python3 tests/test_scan.py

      - name: Model unit tests
        run: node tests/test_model.js
